<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Librería online con una gran variedad de libros en español. Encuentra literatura, ciencia, tecnología y mucho más." />
  <title>Entre Líneas - Librería Online</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="imagenes/logo.svg" />
  <!-- CSS propio -->
  <link rel="stylesheet" href="styles.css" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@400;700&display=swap"
    rel="stylesheet" />
  <meta name="robots" content="index, follow">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DXQBDYRG6G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-DXQBDYRG6G');
  </script>
</head>



<body>
  <div id="header"></div>
  <main class="container mb-5">
    <div id="carrito-container">
      <div class="table-responsive">
        <table class="table table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th>Producto</th>
              <th class="text-center">Cantidad</th>
              <th class="text-center">Precio</th>
              <th class="text-center">Total</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>

      <div class="text-end">
        <p><strong>Total:</strong> <span id="tot">0,00</span> €</p>
        <div class="d-flex justify-content-end gap-3 flex-wrap">
          <button id="vaciar" class="btn btn-danger" data-bs-toggle="modal"
            data-bs-target="#confirmarVaciarModal">Vaciar carrito</button>
          <a href="checkout.html" class="btn btn-success fw-bold">Finalizar compra</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal eliminar producto -->
  <div class="modal fade" id="confirmarEliminarModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">¿Eliminar producto?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">¿Estás seguro de que quieres eliminar este producto?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="confirmarEliminarBtn">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal vaciar carrito -->
  <div class="modal fade" id="confirmarVaciarModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">¿Vaciar carrito?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">Esta acción eliminará todos los productos. ¿Seguro que deseas continuar?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="confirmarVaciarBtn">Vaciar todo</button>
        </div>
      </div>
    </div>
  </div>




  <!-- Footer -->
  <div id="footer"></div>
  <!-- Botón volver arriba -->
  <button id="btn-subir" title="Volver arriba">⬆️</button>
  <!-- JavaScript general -->
  <script src="js/main.js" type="module"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
