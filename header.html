<!-- Header -->
<header class="bg-light shadow-sm py-2">
  <div class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-light" role="navigation" aria-label="Menú principal">
      <a class="navbar-brand d-flex align-items-center me-5" href="index.html">
        <img src="imagenes/logo.svg" alt="Logo de la librería Entre Líneas" width="50" height="50" class="me-2" />
        <span class="fw-bold">Entre Líneas</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
        aria-controls="navbarContent" aria-expanded="false" aria-label="Mostrar u ocultar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html" data-en="Home" data-es="Inicio">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="pagina-de-busqueda.html" data-en="Search"
              data-es="Buscar">Buscar</a></li>
          <li class="nav-item"><a class="nav-link" href="carrito.html" data-en="Shopping cart" data-es="Cesta">Cesta</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="pagina-de-informacion.html" data-en="Information and contact"
              data-es="Información y contacto">Información y contacto</a></li>
        </ul>

        <div class="d-flex align-items-center justify-content-center mx-auto" style="gap: 0.75rem; max-width: 500px;">
          <form class="d-flex" role="search" aria-label="Buscar libros en el catálogo">
            <label for="buscador" class="visually-hidden">Buscar libros</label>
            <input class="form-control me-2" id="buscador" type="search" placeholder="Buscar..."
              aria-label="Buscar libros" />
            <button class="btn btn-outline-primary" type="submit" data-en="Search" data-es="Buscar">Buscar</button>
          </form>

          <select id="idioma" class="form-select w-auto">
            <option value="es" selected>ES</option>
            <option value="en">EN</option>
          </select>

        </div>

        <button id="btn-carrito" aria-controls="carrito" aria-expanded="false" aria-label="Abrir carrito de la compra">
          <img src="iconos/cart.svg" alt="Carrito" />
        </button>

        <aside id="carrito" role="complementary" aria-label="Resumen del carrito de compra">
          <p data-es="Elementos:" data-en="Items:">Elementos: <span id="cant">0</span></p>
          <ul id="lista"></ul>
          <p data-es="IVA:" data-en="VAT:">IVA: <span id="iva">0,00</span> €</p>
          <p data-es="Total:" data-en="Total:">Total: <span id="tot">0,00</span> €</p>
          <button id="vaciar" class="btn" data-es="Vaciar carrito" data-en="Empty cart">Vaciar carrito</button>
          <a href="carrito.html" class="btn btn-success w-100 mt-3 fw-bold">Ir a la cesta</a>
        </aside>
      </div>
    </nav>
  </div>
</header>
